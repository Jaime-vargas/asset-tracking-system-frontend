<div class="main-container">
  <span class="title">{{formTitle()}}</span>
  <nz-divider></nz-divider>

  @if (selectedBranch(); as project) {
    <p>Created <time [attr.datetime]="project.createdDate">{{ project.createdDate | date:'dd MMM yyyy':'UTC' }}</time></p>
  }
  <form nz-form [formGroup]="branchForm" (ngSubmit)="submitForm()" style="height: stretch">
    <nz-form-item>
      <nz-form-label class="sub-title" nzRequired>Name</nz-form-label>
      <nz-form-control [nzErrorTip] = "nameErrorTpl">
        <input nz-input formControlName="name" >
      </nz-form-control>
    </nz-form-item>

    <nz-divider></nz-divider>
    <div class="buttons-container" nz-flex nzAlign="center" nzJustify="flex-end"
         style="width: 100%; gap: 20px">
      <button nz-button class="form-btn default-btn" nzType="default" nzSize="large" type="button" [disabled]="saving()" (click)="onClose()">Cancel</button>
      <button nz-button class="form-btn primary-btn" nzType="primary" nzSize="large" type="submit" [nzLoading]="saving()" [disabled]="branchForm.invalid || branchForm.controls.name.value.trim().length < 3 || saving()">
        <nz-icon nzType="save" nzTheme="outline" />Save Changes</button>
    </div>
  </form>
</div>

<!-- Template Errors -->
<ng-template #nameErrorTpl let-control>
  @if (control.hasError('required')) {
    Name is mandatory
  }
  @if (control.hasError('minlength')) {
    Name is too short
  }
  @if (control.hasError('maxlength')) {
    Name is too large
  }
</ng-template>
