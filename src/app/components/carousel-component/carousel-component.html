<nz-image-group class="evidence-gallery">
  @for (image of images(); track image.id) {
    <div class="evidence-item">
      <button class="evidence-preview" type="button" [attr.aria-label]="'Preview ' + image.filename" (click)="preview.onPreview()">
        <img nz-image #preview="nzImage" [src]="image.filePath" [nzSrc]="image.filePath"
          [nzFallback]="defaultImgPlaceholder" [alt]="image.filename" />
      </button>
      @if (showDeleteButton()) {
        <button nz-button nzDanger type="button" class="evidence-delete"
          [attr.aria-label]="'Delete photo ' + image.filename"
          nz-popconfirm nzPopconfirmTitle="Delete this photo?" nzPopconfirmPlacement="bottomRight"
          (nzOnConfirm)="deleteEvent.emit(image.id)">
          <nz-icon nzType="delete" />
        </button>
      }
    </div>
  }
</nz-image-group>
