<div class="bg-white shadow fitContent boxComponent"
     [style.height]="flex() ? '100%' : null"
      [style.background-color]="bgColor()">
  @if (boxTitle()){
    <h3 nz-typography class="title">{{boxTitle() }}</h3>
    <nz-divider nzSize="small"></nz-divider>
  }
  <div class="boxBody">
    <ng-content select="[body]"></ng-content>
  </div>

  <ng-content select="[footer]"></ng-content>
</div>
