<button nz-button
        class="form-btn"
        [nzType]="type() === 'edit' ? 'default' : 'primary'"
        [class]="type() === 'edit' ? 'edit-button default-btn': 'primary-btn'"
        >
  @if (type() === 'link'){
    {{buttonLabel()}}
    <nz-icon nzType="right" />
  } @else {
    <nz-icon nzType="edit" nzTheme="fill" />
    {{buttonLabel()}}
  }
</button>
