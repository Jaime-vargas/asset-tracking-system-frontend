<button nz-button
        class="form-btn"
        [nzType]="type() === 'edit' ? 'default' : 'primary'"
        [class]="type() === 'edit' ? 'edit-button default-btn': 'primary-btn'"
        >

  @switch (type()){
    @case ('link'){
      {{buttonLabel()}}
      <nz-icon nzType="right" />
    }
    @case ("edit"){
      <nz-icon nzType="edit" nzTheme="fill" />
      {{buttonLabel()}}
    }
    @case ('download'){
      <nz-icon nzType="download" nzTheme="outline" />
    }
  }
</button>
