@if (authService.token()) {
  <div
    nz-flex
    nzGap="small"
    nzAlign="center"
    nz-popover
    [nzPopoverContent]="userMenu"
    [nzPopoverPlacement]="'leftTop'"
    nzPopoverTrigger="click"
    nzPopoverTitle="User Data"
    class="user-trigger"
  >
    <span class="user-avatar" aria-hidden="true">{{ userData()?.fullName?.charAt(0) }}</span
    ><span class="user-name">{{ userData()?.fullName }}</span>
  </div>
}
<!-- Drop down - Current User -->
<ng-template #userMenu>
  <div nz-menu nz-flex nzVertical>
    <div style="height: 25px">
      <span>username: </span>
      <span
        ><strong>{{ userData()?.username }}</strong></span
      >
    </div>
    <div style="height: 25px">
      <span>role: </span>
      <span
        ><strong>{{ userData()?.role }}</strong></span
      >
    </div>
    <div nz-flex nzVertical nzGap="small">
      <button nz-button class="form-btn" (click)="changePassword()">Change password</button>
      <button nz-button class="form-btn" (click)="logout()" nzDanger nzType="primary">
        Log Out
      </button>
    </div>
  </div>
</ng-template>
<!-- PASSWORD CHANGE MODAL -->
<ng-template #changePasswordModal>
  <app-user-change-password-form (close)="modalRef?.close()"></app-user-change-password-form>
</ng-template>
