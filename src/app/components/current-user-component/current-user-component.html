@if (authService.token()) {
  <button
    type="button"
    aria-label="Account options"
    [attr.aria-expanded]="menuOpen()"
    nz-flex
    nzGap="small"
    nzAlign="center"
    nz-popover
    [nzPopoverContent]="userMenu"
    nzPopoverPlacement="bottomRight"
    nzPopoverTrigger="click"
    [nzPopoverVisible]="menuOpen()"
    (nzPopoverVisibleChange)="menuOpen.set($event)"
    class="user-trigger"
  >
    <span class="user-avatar" aria-hidden="true">{{ userData()?.fullName?.charAt(0) }}</span
    ><span class="user-name">{{ userData()?.fullName }}</span>
  </button>
}
<!-- Drop down - Current User -->
<ng-template #userMenu>
  <section class="account-panel" aria-label="Account" (keydown.escape)="menuOpen.set(false)">
    <div class="account-header">
      <span class="user-avatar account-avatar" aria-hidden="true">{{ userData()?.fullName?.charAt(0) }}</span>
      <div class="account-identity">
        <strong>{{ userData()?.fullName }}</strong>
        <span>{{ userData()?.username }}</span>
      </div>
    </div>
    <span class="account-role">{{ userData()?.role }}</span>
    <div class="account-actions">
      <button type="button" (click)="changePassword()">Change password</button>
      <button type="button" class="logout" (click)="logout()">Log out</button>
    </div>
  </section>
</ng-template>
<!-- PASSWORD CHANGE MODAL -->
<ng-template #changePasswordModal>
  <app-user-change-password-form (close)="modalRef?.close()"></app-user-change-password-form>
</ng-template>
