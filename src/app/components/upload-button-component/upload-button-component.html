<nz-upload
  nzType="select"
  [nzAccept]="acceptedFiles()"
  [nzMultiple]="multipleFiles()"
  [nzDisabled]="disabled()"
  [nzBeforeUpload]="beforeUpload()"
  [nzName]="'file'"
  [nzShowUploadList]="false"
  [nzAction]="uploadUrl()"
  (nzChange)="onUploadChange($event)"
>
    <ng-content select="[body]">
    </ng-content>
</nz-upload>
