<div
  class="mainframe"
  [class.client-area]="clientArea()"
  [class.login-area]="loginArea()"
  [class.navigation-open]="menuOpen()"
  (keydown.escape)="menuOpen.set(false)"
>
  @if (!loginArea()) {
    <button
      class="mobile-menu"
      type="button"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      aria-label="Toggle navigation"
    >
      ☰
    </button>
    @if (menuOpen()) {
      <button
        class="menu-backdrop"
        (click)="menuOpen.set(false)"
        aria-label="Close navigation"
      ></button>
    }
    <div id="main-navigation" class="navigation-column" [class.menu-open]="menuOpen()">
      <app-menu-sidebar-component (aboutOpened)="menuOpen.set(false)" />
    </div>
  }
  <main class="contentFrame">
    @if (!loginArea()) {
      <app-current-user-component />
    }
    <router-outlet />
  </main>
</div>
