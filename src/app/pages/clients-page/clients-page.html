<div class="contentPage">
  <h2 nz-typography>Clients</h2>

  <div class="contentBody">
    <div nz-row [nzGutter]="[10,10]">
      <div nz-col nzSpan="24">

        <!-- SEARCH SECTION -->
        <app-dasboard-box-component>
          <div body nz-flex nzGap="middle">
            <nz-input-wrapper nzAllowClear >
              <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
              <input nz-input [ngModel]="clientNameFilter()" (ngModelChange)="clientNameFilter.set($event)" placeholder=" Search clients..." />
            </nz-input-wrapper>
            <!-- /SEARCH SECTION -->

            <button  nz-button class="form-btn primary-btn" nzType="primary" (click)="openNewSidebar()"><nz-icon nzType="plus" nzTheme="outline"/>Add Client</button>

          </div>
        </app-dasboard-box-component>

      </div>

      <!-- TABLE COMPONENT -->
      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body>
            <app-table-component
              [tableColumns]="tableClientService.tableColumns"
              [tableData]="tableData()"></app-table-component>
          </div>
        </app-dasboard-box-component>
      </div>
    </div>
  </div>
</div>

<!-- SIDEBAR COMPONENT -->
@if(openSideBar()){
  <app-edit-side-bar>
    <div body>
      <app-client-form></app-client-form>
    </div>
  </app-edit-side-bar>
}
<!-- /SIDEBAR COMPONENT -->
