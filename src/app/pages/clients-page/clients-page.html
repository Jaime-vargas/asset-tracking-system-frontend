<div class="contentPage">
  <h2 nz-typography>Clients</h2>
  <nz-divider></nz-divider>
  <div class="contentBody">
    <div nz-row [nzGutter]="[10,10]">
      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body nz-flex nzGap="middle">
            <nz-input-wrapper nzAllowClear >
              <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
              <input nz-input [ngModel]="clientNameFilter()" (ngModelChange)="clientNameFilter.set($event)" placeholder=" Search clients..." />
            </nz-input-wrapper>
            <button nz-button nzType="primary"><nz-icon nzType="plus" nzTheme="outline" />Add Branch</button>
          </div>
        </app-dasboard-box-component>
      </div>
      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body>
            <nz-table #tableData nzSize="default" [nzScroll]="{ x: 'max-content' }" [nzData]="filteredClients()" >
              <colgroup>
                <col style="width: 150px" />
                <col style="width: 100px" />
                <col style="width: 100px" />
                <col style="width: 150px" />
                <col style="width: 200px" />
              </colgroup>
              <thead>
              <tr>
                <th>Name</th>
                <th>Branches</th>
                <th>Hardware</th>
                <th>Reports</th>
                <th>Actions</th>
              </tr>
              </thead>
              @if (tableData.data.length > 0) {
              <tbody>
                @for (client of tableData.data; track client.id){
                  <tr>
                    <td>{{client.name}}</td>
                    <td><nz-icon nzType="shop" nzTheme="fill" class="bg-green table-icon" />{{client.branches}}</td>
                    <td><nz-icon nzType="video-camera" nzTheme="fill" class="bg-green table-icon" />{{client.totalHardware}}</td>
                    <td><app-report-count-tags-component [reports]="client.reportsActive"></app-report-count-tags-component></td>
                    <td>
                      <button nz-button nzType="primary" [routerLink]="['/clients', client.id, utilityService.slugify(client.name)]" >Manage<nz-icon nzType="right" /></button>
                      <button class="edit-button" nz-button nzType="default"><nz-icon nzType="edit" nzTheme="fill" />Edit</button>
                    </td>
                  </tr>
                }
              </tbody>
              } @else {
                <td colspan="5">
                  <nz-empty nzNotFoundImage="simple"></nz-empty>
                </td>
              }
            </nz-table>
          </div>
        </app-dasboard-box-component>
      </div>
    </div>
  </div>
</div>
