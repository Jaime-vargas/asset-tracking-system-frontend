<div class="contentPage">
  <h2 nz-typography>All Hardware</h2>
  <nz-divider></nz-divider>
  <div class="contentBody">
    <div nz-row [nzGutter]="[10,10]">
      <div nz-col nzSpan="24">
        <app-dashboard-box-component>
          <div body nz-row [nzGutter]="[5,5]">
            <div nz-col nzFlex="1 0 100px">
              <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Select a client" [ngModel]="clientFilter()" (ngModelChange)="clientFilter.set($event)">
                @for (client of clientList(); track $index){
                  <nz-option [nzLabel]="client" [nzValue]="client" />
                }
              </nz-select>
            </div>
            <div nz-col nzFlex="1 0 100px">
              <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Select a project" [ngModel]="branchFilter()" (ngModelChange)="branchFilter.set($event)" >
                @for (branch of branchList(); track $index){
                  <nz-option [nzLabel]="branch" [nzValue]="branch" />
                }
              </nz-select>
            </div>
            <div nz-col nzFlex="1 0 auto">
              <nz-select nzShowSearch nzAllowClear nzPlaceHolder="Type" [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event)">
                @for (type of typeList(); track $index){
                  <nz-option [nzLabel]="type" [nzValue]="type" />
                }
              </nz-select>
            </div>
            <div nz-col nzFlex="1 0 200px" >
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="nameFilter()" (ngModelChange)="nameFilter.set($event)"  placeholder=" Search Name..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px" >
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="modelFilter()" (ngModelChange)="modelFilter.set($event)"  placeholder=" Search Model..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px" >
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="serialNumberFilter()" (ngModelChange)="serialNumberFilter.set($event)"  placeholder=" Search Serial Number..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px" >
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="locationFilter()" (ngModelChange)="locationFilter.set($event)" placeholder=" Search Location..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px" >
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="lastMaintenanceFilter()" (ngModelChange)="lastMaintenanceFilter.set($event)" placeholder=" Search Last Maintenance..." />
              </nz-input-wrapper>
            </div>
          </div>
        </app-dashboard-box-component>
      </div>
      <!-- TABLE COMPONENT -->
      <div nz-col nzSpan="24">
        <app-dashboard-box-component >
          <div body>
            <app-table-component
              [tableLoading]="tableLoading()"
              [tableColumns]="tableHardwareService.tableColumns"
              [tableData]="tableData()">
            </app-table-component>
          </div>
        </app-dashboard-box-component>
      </div>
    </div>
  </div>
</div>
