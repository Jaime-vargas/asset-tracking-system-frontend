<div class="contentPage">
  <app-breadcrumb-component [breadcrumb]="breadcrumb()"></app-breadcrumb-component>
  <div class="contentBody">
    <div nz-row [nzGutter]="[10,10]">

      <div nz-col nzSpan="24">
        <nz-flex nzJustify="space-between" nzGap="small">
          <div nz-flex nzGap="small">
            <button nz-button class="form-btn default-btn" nz-dropdown [nzDropdownMenu]="downloadMenu" nzPlacement="bottomLeft">Download <nz-icon nzType="download" nzTheme="outline" /></button>
            <button nz-button class="form-btn default-btn" nz-dropdown [nzDropdownMenu]="importMenu" nzPlacement="bottomLeft">Import</button>
          </div>
          <button nz-button class="form-btn primary-btn" nzType="primary" nz-dropdown [nzDropdownMenu]="newMenu" nzPlacement="bottomRight"><nz-icon nzType="plus" nzTheme="outline" />Add Hardware</button>
        </nz-flex>
      </div>

      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body nz-row [nzGutter]="[5,5]">
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event)"  placeholder=" Search Type..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="nameFilter()" (ngModelChange)="nameFilter.set($event)"  placeholder=" Search Name..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="modelFilter()" (ngModelChange)="modelFilter.set($event)"  placeholder=" Search Model..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="serialNumberFilter()" (ngModelChange)="serialNumberFilter.set($event)"  placeholder=" Search Serial Number..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="locationFilter()" (ngModelChange)="locationFilter.set($event)" placeholder=" Search Location..." />
              </nz-input-wrapper>
            </div>
            <div nz-col nzFlex="1 0 200px">
              <nz-input-wrapper nzAllowClear >
                <nz-icon nzInputPrefix nzType="search" nzTheme="outline" />
                <input nz-input [ngModel]="lastMaintenanceFilter()" (ngModelChange)="lastMaintenanceFilter.set($event)" placeholder=" Search Last Maintenance..." />
              </nz-input-wrapper>
            </div>
          </div>
        </app-dasboard-box-component>
      </div>
      <!-- TABLE COMPONENT -->
      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body>
            <app-table-component
              [tableColumns]="tableBranchHardwareService.tableColumns"
              [tableData]="tableData()"></app-table-component>
          </div>
        </app-dasboard-box-component>
      </div>
      <!-- /TABLE COMPONENT -->
    </div>
  </div>
</div>

<!-- Drop down - Download button -->
<nz-dropdown-menu #downloadMenu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item (click)="hardwareStore.getPhotoReportByBranchId()">Photo report</li>
    <li nz-menu-item (click)="hardwareStore.getTechnicalMemoryByBranchId()">Technical memory</li>
    <li nz-menu-item (click)="hardwareStore.getQrCodesByBranchId()">QR codes</li>
  </ul>
</nz-dropdown-menu>

<nz-dropdown-menu #importMenu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item>Import from .XLS</li>
    <li nz-menu-item>Download template</li>
  </ul>
</nz-dropdown-menu>
<nz-dropdown-menu #newMenu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item (click)="openNewSidebar()">Camera</li>
    <li nz-menu-item>Switch</li>
    <li nz-menu-item>Server</li>
  </ul>
</nz-dropdown-menu>

<!-- SIDEBAR COMPONENT -->
@if(openSideBar()){
  <app-edit-side-bar>
    <div body>
      <app-camera-form></app-camera-form>
    </div>
  </app-edit-side-bar>
}
<!-- /SIDEBAR COMPONENT -->
