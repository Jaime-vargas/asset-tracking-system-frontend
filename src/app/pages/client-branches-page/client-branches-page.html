<div class="contentPage">
  <app-breadcrumb-component [breadcrumb]="breadcrumb()"></app-breadcrumb-component>
  <nz-divider></nz-divider>

  <!-- SIDEBAR COMPONENT -->
  @if(isOpenSidebar()){
    <app-edit-side-bar>
      <div body>
        <app-branch-form></app-branch-form>
      </div>
    </app-edit-side-bar>
  }
  <!-- /SIDEBAR COMPONENT -->
  <div class="contentBody">
    <div nz-row [nzGutter]="[10,10]">
      <div nz-col nzSpan="24">

        <!-- SEARCH SECTION -->
        <app-dasboard-box-component>
          <div body nz-flex nzGap="middle">
            <nz-input-wrapper nzAllowClear>
              <nz-icon nzInputPrefix nzType="search" nzTheme="outline"/>
              <input nz-input [ngModel]="branchNameFilter()" (ngModelChange)="branchNameFilter.set($event)"
                     placeholder=" Search branches..."/>
            </nz-input-wrapper>
            <button nz-button class="form-btn primary-btn" nzType="primary">
              <nz-icon nzType="plus" nzTheme="outline"/>
              Add Branch
            </button>
          </div>
        </app-dasboard-box-component>
        <!-- /SEARCH SECTION -->
      </div>

      <!-- TABLE COMPONENT -->
      <div nz-col nzSpan="24">
        <app-dasboard-box-component>
          <div body>
            <app-table-component
              [tableColumns]="tableClientsBranchesService.tableColumns"
              [tableData]="tableData()">
            </app-table-component>
          </div>
          </app-dasboard-box-component>
      </div>

    </div>
  </div>
</div>
